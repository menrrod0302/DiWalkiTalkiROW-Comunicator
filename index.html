<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Walkie-Talkie</title>
    <style>
        :root {
            --ink-black: #000814;
            --prussian-blue: #001D3D;
            --oxford-navy: #003566;
            --school-bus-yellow: #FFC300;
            --gold: #FFD60A;
            --scanline-color: rgba(0, 0, 0, 0.3);
        }

        body { 
            font-family: 'Orbitron', 'Segoe UI', sans-serif; 
            background-color: var(--ink-black); 
            color: var(--gold);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, var(--oxford-navy) 0%, var(--ink-black) 80%);
        }

        /* CAPA DE LÍNEAS LCD (Como image_850001.png) */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(var(--scanline-color) 50%, transparent 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.4;
        }

        /* Efecto de parpadeo sutil de pantalla antigua */
        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.99; }
            100% { opacity: 1; }
        }
        .main-container { animation: flicker 0.1s infinite; z-index: 10; }

        /* Pantalla Principal Circular Estilo Jarvis */
        .jarvis-hud {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid var(--oxford-navy);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(0, 53, 102, 0.5), inset 0 0 30px rgba(0, 53, 102, 0.5);
            margin-bottom: 20px;
        }

        .freq-value { 
            font-size: 3.5rem; 
            color: var(--gold); 
            text-shadow: 0 0 20px var(--school-bus-yellow); 
            margin: 0;
            font-weight: 900;
            letter-spacing: 5px;
        }

        /* Botón PTT Futurista */
        #pushToTalk { 
            width: 160px; height: 160px; border-radius: 50%;
            background: transparent;
            border: 4px double var(--school-bus-yellow);
            color: var(--gold); 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px var(--oxford-navy);
            position: relative;
            z-index: 105;
            transition: 0.2s;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
        }

        #pushToTalk:active {
            background: rgba(255, 195, 0, 0.2);
            transform: scale(0.9);
            box-shadow: 0 0 40px var(--gold);
        }

        /* Anillos animados */
        .ring {
            position: absolute;
            border: 1px solid var(--oxford-navy);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Estilos de inputs */
        input { 
            background: transparent; border: 1px solid var(--oxford-navy); 
            color: var(--gold); padding: 10px; font-size: 1.5rem; width: 120px; 
            text-align: center; border-radius: 4px; outline: none;
            text-shadow: 0 0 5px var(--gold);
        }

        button#joinBtn { 
            padding: 10px 20px; background: var(--oxford-navy); 
            color: var(--gold); border: 1px solid var(--school-bus-yellow); 
            cursor: pointer; font-weight: bold; letter-spacing: 2px;
        }

        .led { width: 100%; height: 2px; background: var(--oxford-navy); position: absolute; top: 50%; }
        .led.active { background: #ff0000; box-shadow: 0 0 20px #ff0000; }
        .led.receiving { background: var(--gold); box-shadow: 0 0 20px var(--gold); }

    </style>
    <!-- Fuente futurista -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <div class="jarvis-hud">
            <!-- Anillos decorativos -->
            <div class="ring" style="width: 280px; height: 280px; border-style: dashed;"></div>
            <div class="ring" style="width: 240px; height: 240px; border-width: 4px; border-color: var(--oxford-navy); opacity: 0.3;"></div>
            
            <div class="freq-label" style="font-size: 0.6rem; letter-spacing: 3px;">SIGNAL_STATUS</div>
            <div id="displayCode" class="freq-value">----</div>
            <div id="statusIndicator" style="font-size: 0.7rem;">SYSTEM_OFFLINE</div>
            <div id="led" class="led"></div>
        </div>
        
        <div class="controls" id="setupSection" style="text-align: center;">
            <input type="number" id="roomInput" placeholder="ID">
            <button id="joinBtn">INITIALIZE</button>
        </div>

        <div id="pttSection" style="display: none; text-align: center;">
            <button id="pushToTalk">TRANSMIT</button>
            <p id="pttStatus" style="font-size: 0.7rem; margin-top: 20px; letter-spacing: 2px;">READY TO COMMS</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Mantén toda la lógica de JavaScript anterior (AudioContext, Sockets, etc.)
        // Solo asegúrate de actualizar los IDs si han cambiado (aunque he mantenido los mismos)
        const socket = io();
        const roomInput = document.getElementById('roomInput');
        const joinBtn = document.getElementById('joinBtn');
        const talkBtn = document.getElementById('pushToTalk');
        const displayCode = document.getElementById('displayCode');
        const led = document.getElementById('led');
        const statusText = document.getElementById('statusIndicator');
        const pttStatus = document.getElementById('pttStatus');

        let currentRoom = null;
        let mediaRecorder;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(freq, dur, start) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + start); osc.stop(audioCtx.currentTime + start + dur);
        }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0 && currentRoom) {
                    socket.emit('audio-stream', { room: currentRoom, blob: e.data });
                }
            };

            const startTalk = (e) => {
                e.preventDefault();
                if(mediaRecorder.state === "inactive") {
                    playTone(600, 0.1, 0);
                    mediaRecorder.start(100);
                    led.classList.add('active');
                    pttStatus.innerText = "UPLINK_ACTIVE";
                }
            };

            const stopTalk = (e) => {
                e.preventDefault();
                if(mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    playTone(900, 0.1, 0); playTone(1200, 0.1, 0.1);
                    led.classList.remove('active');
                    pttStatus.innerText = "READY_TO_COMMS";
                }
            };

            talkBtn.onmousedown = talkBtn.ontouchstart = startTalk;
            talkBtn.onmouseup = talkBtn.ontouchend = stopTalk;

        }).catch(err => console.log(err));

        joinBtn.onclick = () => {
            const code = roomInput.value;
            if(code.length >= 1) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                currentRoom = code;
                socket.emit('join-room', code);
                displayCode.innerText = code.padStart(4, '0');
                document.getElementById('setupSection').style.display = 'none';
                document.getElementById('pttSection').style.display = 'block';
                statusText.innerText = "COMMS_ESTABLISHED";
            }
        };

        socket.on('audio-stream', async (blobData) => {
            led.classList.add('receiving');
            const blob = new Blob([blobData], { type: 'audio/webm' });
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();
            audio.onended = () => {
                playTone(1000, 0.1, 0); led.classList.remove('receiving');
            };
        });
    </script>
</body>
</html>
</body>
</html>
